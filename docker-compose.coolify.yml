# Coolify stack: point the resource's "Docker Compose Location" at /docker-compose.coolify.yml.
# On first boot config.example.yaml is copied to the persistent config volume as config.yaml,
# with the placeholder client API keys replaced by the generated SERVICE_PASSWORD_64_APIKEY
# and plugins enabled (loaded from the persistent plugins volume).
# The API is only reachable over Tailscale: the proxy shares the tailscale sidecar's network
# and is served at http://<TS_HOSTNAME>:8317 on the tailnet. No public port or domain.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: ${TS_HOSTNAME:-cliproxy}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-cliproxy}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "tailscale", "--socket=/tmp/tailscaled.sock", "status"]
      interval: 30m
      timeout: 10s
      retries: 1
      start_period: 30s
      start_interval: 5s
    restart: unless-stopped

  cli-proxy-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # SOURCE_COMMIT is set by Coolify when "Include Source Commit in Build" is enabled.
        VERSION: ${SOURCE_COMMIT:-dev}
        COMMIT: ${SOURCE_COMMIT:-none}
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
        restart: true
    environment:
      - MANAGEMENT_PASSWORD=${SERVICE_PASSWORD_MANAGEMENT}
      - API_KEY=${SERVICE_PASSWORD_64_APIKEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f data/config.yaml ]; then
          sed -e "s|your-api-key-1|$$API_KEY|" -e '/your-api-key-[23]/d' \
            -e '/^plugins:/,/^  enabled:/s/enabled: false/enabled: true/' \
            config.example.yaml > data/config.yaml
        fi
        exec ./CLIProxyAPI -config data/config.yaml
    volumes:
      - cliproxy-config:/CLIProxyAPI/data
      - cliproxy-auths:/root/.cli-proxy-api
      - cliproxy-logs:/CLIProxyAPI/logs
      - cliproxy-plugins:/CLIProxyAPI/plugins
    healthcheck:
      # The image has no curl; bash /dev/tcp issues the GET /healthz request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8317 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 30m
      timeout: 10s
      retries: 1
      start_period: 30s
      start_interval: 5s
    restart: unless-stopped

volumes:
  tailscale-state:
  cliproxy-config:
  cliproxy-auths:
  cliproxy-logs:
  cliproxy-plugins:
